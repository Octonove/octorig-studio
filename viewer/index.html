<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; img-src 'self' blob: data:; script-src 'self' 'unsafe-inline'; style-src 'self'; object-src 'none'; base-uri 'none'">
  <title>OctoRig Studio | Model Viewer</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.min.js"}}</script>
</head>
<body>
  <header><div><p class="eyebrow">OCTORIG STUDIO</p><h1>Model viewer</h1><p>Open a GLB from your device to inspect its existing animations.</p></div></header>
  <main>
    <section class="toolbar" aria-label="Model controls">
      <label class="file-label" for="file">Open GLB</label><input id="file" type="file" accept=".glb,model/gltf-binary">
      <label for="clips">Animation</label><select id="clips" disabled><option>No animations loaded</option></select>
      <button id="play" type="button" disabled>Pause</button><button id="fit" type="button" disabled>Fit model</button>
    </section>
    <p id="status" role="status" aria-live="polite">Choose a GLB file to begin. Your file stays on this device.</p>
    <div class="viewport" id="viewport" aria-label="3D model view"></div>
    <p class="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</p>
  </main>
  <script type="module" src="viewer.js"></script>
</body>
</html>
